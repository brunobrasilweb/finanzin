# Finanzin — spec do projeto Xcode (xcodegen)
# Gera Finanzin.xcodeproj na máquina COM Xcode:
#   brew install xcodegen && xcodegen generate && open Finanzin.xcodeproj
#
# IMPORTANTE: Sources/FinanzinDemo NÃO entra no app iOS (tem @main próprio
# para a demo macOS; incluí-lo quebraria o build com "duplicate @main").

# NOTA DE MONETIZAÇÃO: só o build Release do Xcode (Archive p/ loja/TestFlight)
# compila com `-D FIN_STORE_BUILD` e aplica o paywall (Free limitado, Pro via StoreKit).
# Todo o resto é dev com tudo liberado (`isPro == true`, sem compra):
# - `swift build` / `swift run FinanzinDemo` (SPM/CLT, sem a flag);
# - Xcode em Debug (iPhone via cabo ou simulador).
# Ou seja: só o Archive/Release cobra; desenvolver e testar é sempre livre.

name: Finanzin

options:
  bundleIdPrefix: br.inoovexa
  deploymentTarget:
    iOS: "17.0"

targets:
  FinanzinCore:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FinanzinCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      configs:
        Release:
          OTHER_SWIFT_FLAGS: $(inherited) -D FIN_STORE_BUILD
  FinanzinUI:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FinanzinUI
    dependencies:
      - target: FinanzinCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      configs:
        Release:
          OTHER_SWIFT_FLAGS: $(inherited) -D FIN_STORE_BUILD
  Finanzin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinanzinApp/FinanzinApp.swift
      - path: FinanzinApp/RegistrarGastoIntent.swift
      - path: FinanzinApp/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: FinanzinUI
      - target: FinanzinCore
    info:
      path: FinanzinApp/Info.plist
      # Chaves customizadas do plist DEVEM ser declaradas aqui: o xcodegen
      # reescreve o arquivo e apaga o que não estiver no spec (foi assim que
      # o UILaunchScreen sumiu e o app voltou a abrir pequeno no iPhone).
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Tire foto do recibo para ler os dados e anexar como comprovante."
        NSPhotoLibraryUsageDescription: "Escolha a foto do recibo para ler os dados e anexar como comprovante."
        NSMicrophoneUsageDescription: "Grave a descrição do gasto para transcrever no próprio iPhone."
        NSSpeechRecognitionUsageDescription: "Transcrever sua voz em texto para preencher valor e descrição, de preferência offline."
        CFBundleURLTypes:
          - CFBundleURLName: br.inoovexa.finanzin
            CFBundleURLSchemes: [finanzin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.inoovexa.finanzin
        DEVELOPMENT_TEAM: VLHPBD4Q57
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release:
          OTHER_SWIFT_FLAGS: $(inherited) -D FIN_STORE_BUILD
