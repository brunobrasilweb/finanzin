# Finanzin — spec do projeto Xcode (xcodegen)
# Gera Finanzin.xcodeproj na máquina COM Xcode:
#   brew install xcodegen && xcodegen generate && open Finanzin.xcodeproj
#
# IMPORTANTE: Sources/FinanzinDemo NÃO entra no app iOS (tem @main próprio
# para a demo macOS; incluí-lo quebraria o build com "duplicate @main").

name: Finanzin

options:
  bundleIdPrefix: br.inoovexa
  deploymentTarget:
    iOS: "17.0"

targets:
  FinanzinCore:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FinanzinCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  FinanzinUI:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FinanzinUI
    dependencies:
      - target: FinanzinCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  Finanzin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinanzinApp/FinanzinApp.swift
      - path: FinanzinApp/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: FinanzinUI
      - target: FinanzinCore
    info:
      path: FinanzinApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.inoovexa.finanzin
        DEVELOPMENT_TEAM: VLHPBD4Q57
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
